<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXICUT AI | Full HD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: #111; border: 1px solid #222; border-radius: 30px; }
        #checkerboard { 
            background-image: linear-gradient(45deg, #1a1a1a 25%, transparent 25%), linear-gradient(-45deg, #1a1a1a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1a1a1a 75%), linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
            background-size: 20px 20px; background-color: #000;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="mb-8">
        <h1 class="text-4xl font-black italic tracking-tighter uppercase text-white">
            PIXI<span class="text-blue-500">CUT</span> AI
        </h1>
    </div>

    <div class="glass-card w-full max-w-5xl p-6 md:p-10 shadow-2xl">
        <div class="grid md:grid-cols-2 gap-8">
            
            <div class="space-y-4">
                <div id="dropZone" class="border-2 border-dashed border-gray-800 rounded-3xl h-80 flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 transition-all bg-black/50 overflow-hidden">
                    <div id="uploadUI" class="text-center p-4">
                        <i class="fas fa-image text-5xl text-gray-700 mb-4"></i>
                        <p class="text-gray-400 font-bold uppercase">Click to Select Image</p>
                    </div>
                    <img id="inputPreview" class="hidden h-full w-full object-contain p-2">
                    <input type="file" id="fileInput" class="hidden" accept="image/*">
                </div>
                <button id="processBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black uppercase shadow-lg transition-all active:scale-95">
                    Remove Background (Full HD)
                </button>
            </div>

            <div id="checkerboard" class="rounded-3xl h-80 flex flex-col items-center justify-center relative overflow-hidden border border-gray-800">
                <div id="placeholder" class="text-gray-700 font-bold uppercase tracking-widest text-xs">AI Output</div>
                
                <div id="loader" class="hidden z-20 flex flex-col items-center">
                    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="text-xs font-bold text-blue-400 uppercase tracking-widest text-center">AI is processing locally...<br><span class="text-[10px] text-gray-500">Wait 10 seconds</span></p>
                </div>

                <img id="outputImage" class="hidden h-full w-full object-contain z-10 p-2">
            </div>
        </div>

        <div id="downloadArea" class="hidden mt-6">
            <a id="downloadBtn" href="#" download="pixicut_hd.png" class="flex items-center justify-center gap-2 bg-green-600 hover:bg-green-500 w-full py-4 rounded-2xl font-black text-lg transition-all shadow-xl">
                <i class="fas fa-download"></i> DOWNLOAD FULL HD PNG
            </a>
        </div>
    </div>

    <script type="module">
        // Hum aik aisi library use kar rahe hain jo direct browser mein AI chalti hai
        import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js';

        const fileInput = document.getElementById('fileInput');
        const inputPreview = document.getElementById('inputPreview');
        const uploadUI = document.getElementById('uploadUI');
        const processBtn = document.getElementById('processBtn');
        const outputImage = document.getElementById('outputImage');
        const loader = document.getElementById('loader');
        const placeholder = document.getElementById('placeholder');
        const downloadArea = document.getElementById('downloadArea');
        const downloadBtn = document.getElementById('downloadBtn');
        const dropZone = document.getElementById('dropZone');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                inputPreview.src = URL.createObjectURL(file);
                inputPreview.classList.remove('hidden');
                uploadUI.classList.add('hidden');
                downloadArea.classList.add('hidden');
                outputImage.classList.add('hidden');
            }
        };

        processBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert("Pehle photo select karein!");
                return;
            }

            // Start Loading
            loader.classList.remove('hidden');
            placeholder.classList.add('hidden');
            outputImage.classList.add('hidden');
            downloadArea.classList.add('hidden');
            processBtn.disabled = true;
            processBtn.innerText = "PLEASE WAIT...";

            try {
                // Ye AI call hai jo bina key ke chalti hai
                const blob = await imglyRemoveBackground(file);
                const url = URL.createObjectURL(blob);
                
                outputImage.src = url;
                downloadBtn.href = url;

                outputImage.classList.remove('hidden');
                downloadArea.classList.remove('hidden');
            } catch (err) {
                console.error(err);
                alert("Error: Website ko online host karein (GitHub par) tabhi ye kaam karega.");
            } finally {
                loader.classList.add('hidden');
                processBtn.disabled = false;
                processBtn.innerText = "Remove Background (Full HD)";
            }
        };
    </script>
</body>
</html>
